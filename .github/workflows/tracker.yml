name: Weekly Citation Tracker Update

on:
  schedule:
    # Runs every Monday at 12:00 PM EST / 16:00 UTC
    - cron: '0 16 * * 1'
  workflow_dispatch:

# Explicitly grant write access to commit updated index.html back to main
permissions:
  contents: write

jobs:
  update-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Update Script
        run: python update_tracker.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Automated weekly citation update" || exit 0
          git push
